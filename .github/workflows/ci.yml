name: ci

# DISABLED for now: this only runs when started by hand (Actions tab -> ci -> Run workflow).
# To turn automatic CI back on, replace `workflow_dispatch:` with:
#   push:
#   pull_request:
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install hatch
      # Lint, strict type check (ty), and the offline tests with the coverage gate.
      - run: hatch run check
