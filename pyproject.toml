[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learn-langchain"
version = "0.1.0"
description = "A targeted LangChain tutorial: the parts of LangChain that make LangGraph easier to understand and use"
requires-python = ">=3.12"
# Exact pins, verified working together on 2026-11-12 (latest releases on PyPI that day).
# They match the sibling learn-langgraph repo so the two tutorials describe the same versions.
dependencies = [
  "langgraph==1.2.21",
  "langchain==1.5.0",
  "langchain-core==1.8.0",
  "langchain-anthropic==1.7.10",
  "python-dotenv==1.2.4",
  "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.5",
  "ty==0.0.102",
]

[tool.hatch.build.targets.wheel]
packages = ["lessons"]

# ---------------------------------------------------------------- hatch environments
[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest -q {args}"
cov = "pytest -q --cov --cov-report=term-missing {args}"
live = "pytest -q -m live {args}"          # needs a real API key; see tests/test_live.py
lint = "ruff check ."
fmt = "ruff check --fix ."
typecheck = "ty check"
check = ["lint", "typecheck", "cov"]

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM provider (opt-in: needs ANTHROPIC_API_KEY; run with -m live)"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["lessons", "capstone"]
branch = true

[tool.coverage.report]
fail_under = 85
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# E501: lessons use aligned trailing comments and long teaching strings; wrapping them hurts readability.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]   # RUF00x: lessons deliberately use unicode arrows/dashes

# ---------------------------------------------------------------- ty (Astral) - strictest settings
# Every rule is an error (`all` is ty's wildcard) and the strict analysis switches are on.
# mypy is intentionally not used in this repo.
[tool.ty.environment]
python-version = "3.12"
extra-paths = ["lessons"]              # lessons/common.py is put on sys.path at runtime

[tool.ty.src]
include = ["lessons", "tests"]

[tool.ty.analysis]
respect-type-ignore-comments = false   # only `# ty: ignore[...]` suppresses, and it is itself checked
strict-equality-semantics = true
strict-generic-narrowing = true
return-type-inference = "always"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"
